<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dummy Website</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="column">
            <h3>Guest</h3>
            <div class="guest-buttons">
                <!-- Guest buttons will be dynamically inserted here -->
            </div>
            <button id="add-guest" onclick="addGuest()">Add Guest</button>
            <button id="export" onclick="exportGuestList()">Export Guest List</button>
            <button id="import" onclick="importGuestList()">Import Guest List</button>
        </div>
        <div class="column">
            <h3>Details</h3>
            <div class="details">
                <div class="item">Click on a guest to view details</div>
            </div>
        </div>
    </div>
    <div id="now-display">Current Time: </div>
</body>

</html>
