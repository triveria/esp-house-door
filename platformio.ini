; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Set baud rate for serial communication
monitor_speed = 115200

; Lower DTR and RTS to start ESP32 (why is this needed for STARTING the ESP??)
monitor_rts = 0
monitor_dtr = 0

; ------------------------------------------------------------
; Testing Environment Configuration
; ------------------------------------------------------------

[test_env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Use the Unity testing framework
test_tool = unity

; Exclude the main application src directory from tests and include only lib and test directories
src_filter = -<src/**> +<lib/**> +<test/**>
